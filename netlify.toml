[build]
  publish = "."
  functions = "netlify/functions"

[context.deploy-preview]
  # Deploy previews for all branches except main (free — no credits consumed)

[context.branch-deploy]
  # Branch deploys also free

# Netlify Functions — Node 18 for native fetch support
[functions]
  node_bundler = "esbuild"

# Private client questionnaires: keep out of search engines
[[headers]]
  for = "/q/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
